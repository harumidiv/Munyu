name: Build Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (no signing)
        run: xcodebuild build -project Munyu.xcodeproj -scheme Munyu -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
